{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Happy Journey{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-block">
                <img src="{% static 'core/images/logo.png' %}" alt="Happy Journey logo" class="logo-img">
                <span class="logo-text">Happy journey</span>
            </div>

            <nav class="side-links">
                <a href="{% url 'home' %}" class="side-link active">Home</a>
                <a href="#" class="side-link">About us</a>
                <a href="#" class="side-link">Retreats</a>
                <a href="#" class="side-link">Trekking package</a>
                <a href="#" class="side-link">Gallery</a>
                <a href="#" class="side-link">Reviews</a>
                <a href="#" class="side-link">Blogs</a>
                <a href="#" class="side-link">Contact</a>
            </nav>

            <button class="book-now-btn">Book now</button>
        </aside>

        <!-- MAIN AREA -->
        <div class="main-area">

            <!-- TOP BAR -->
            <header class="topbar">
                <div class="search-box">
                    <input type="text" placeholder="Search destinations...">
                </div>
                <div class="auth-buttons">
                    <button class="login-btn">Login</button>
                    <button class="signup-btn">Sign up</button>
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <main class="page-content">
                {% block content %}
                {% endblock %}
            </main>

        </div>
    </div>

</body>
</html>
